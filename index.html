```html
<script>
const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbzJax-EaWzxvMkqd9XI3BE4Ufer67_8mt6vG28qxufUsEUiEsZiZYFBdQetxFAimG35AA/exec';

let currentUser = null;
let currentToken = null;
let cart = [];
let currentCurrency = 'eur';
let purchaseHistory = [];

const rates = {
    eur: 1,
    usd: 1.17,
    gbp: 0.85
};

function showToastMsg(msg, isErr = false) {

    const toast = document.getElementById('toastMsg');

    toast.textContent = msg;

    toast.className = isErr
        ? 'toast show error'
        : 'toast show';

    setTimeout(() => {
        toast.classList.remove('show');
    }, 3000);
}

function getCurrencySymbol(){

    if(currentCurrency === 'usd') return '$';
    if(currentCurrency === 'gbp') return '£';

    return '€';
}

async function apiCall(action, data = {}) {

    try {

        const response = await fetch(BACKEND_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                action,
                ...data
            })
        });

        return await response.json();

    } catch(err) {

        console.error(err);

        return {
            success: false,
            message: 'Network error'
        };
    }
}

function saveCart(){
    localStorage.setItem('cookieCart', JSON.stringify(cart));
}

function loadCart(){

    const saved = localStorage.getItem('cookieCart');

    if(saved){
        cart = JSON.parse(saved);
    }

    updateCartUI();
}

function addToCart(name, price){

    const existing = cart.find(x => x.name === name);

    if(existing){
        existing.quantity++;
    } else {
        cart.push({
            name,
            price,
            quantity: 1
        });
    }

    saveCart();
    updateCartUI();

    showToastMsg(`${name} added to cart`);
}

function updateCartUI(){

    const items = document.getElementById('cartItems');

    let total = 0;
    let count = 0;

    items.innerHTML = '';

    cart.forEach((item, index) => {

        total += item.price * item.quantity;
        count += item.quantity;

        const div = document.createElement('div');

        div.className = 'cart-item';

        div.innerHTML = `
            <div class="cart-item-content">
                <h4>${item.name}</h4>
                <div class="cart-price">
                    ${getCurrencySymbol()}${item.price.toFixed(2)}
                </div>
            </div>

            <div class="cart-item-controls">
                <button class="qty-btn" onclick="changeQty(${index}, -1)">−</button>
                <span>${item.quantity}</span>
                <button class="qty-btn" onclick="changeQty(${index}, 1)">+</button>
            </div>
        `;

        items.appendChild(div);
    });

    document.getElementById('cartCountBadge').textContent = count;

    document.getElementById('cartTotal').textContent =
        `${getCurrencySymbol()}${total.toFixed(2)}`;
}

function changeQty(index, delta){

    if(!cart[index]) return;

    cart[index].quantity += delta;

    if(cart[index].quantity <= 0){
        cart.splice(index, 1);
    }

    saveCart();
    updateCartUI();
}

function clearCart(){

    cart = [];

    saveCart();
    updateCartUI();

    showToastMsg('Cart cleared');
}

function toggleCart(){
    document.getElementById('cartPanel').classList.toggle('active');
}

async function modalRegister(){

    const username = document
        .getElementById('modalRegUsername')
        .value
        .trim();

    const password = document
        .getElementById('modalRegPassword')
        .value
        .trim();

    if(!username || !password){
        showToastMsg('Fill all fields', true);
        return;
    }

    const res = await apiCall('register', {
        username,
        password
    });

    if(res.success){

        showToastMsg('Registered successfully');

    } else {

        showToastMsg(res.message, true);
    }
}

async function modalLogin(){

    const username = document
        .getElementById('modalUsername')
        .value
        .trim();

    const password = document
        .getElementById('modalPassword')
        .value
        .trim();

    const res = await apiCall('login', {
        username,
        password
    });

    if(res.success){

        currentUser = username;
        currentToken = res.data.token;

        localStorage.setItem('shopUser', JSON.stringify({
            username,
            token: currentToken
        }));

        document.getElementById('userBar').style.display = 'flex';
        document.getElementById('loginPromptBar').style.display = 'none';

        await updateBalanceDisplay();

        closeLoginModal();

        showToastMsg(`Welcome ${username}`);

    } else {

        showToastMsg(res.message, true);
    }
}

function logout(){

    currentUser = null;
    currentToken = null;

    localStorage.removeItem('shopUser');

    document.getElementById('userBar').style.display = 'none';
    document.getElementById('loginPromptBar').style.display = 'flex';

    showToastMsg('Logged out');
}

async function updateBalanceDisplay(){

    if(!currentUser) return;

    const res = await apiCall('getBalance', {
        username: currentUser,
        token: currentToken
    });

    if(res.success){

        document.getElementById('balanceDisplay').innerHTML =
            `💰 Balance: €${Number(res.data.balance).toFixed(2)}`;

    } else {

        logout();
    }
}

async function refreshBalance(){

    await updateBalanceDisplay();

    showToastMsg('Balance refreshed');
}

async function payWithBalance(){

    if(!currentUser){
        showToastMsg('Login first', true);
        return;
    }

    if(cart.length === 0){
        showToastMsg('Cart empty', true);
        return;
    }

    let total = 0;
    let products = [];

    for(let item of cart){

        total += item.price * item.quantity;

        products.push(`${item.name} x${item.quantity}`);
    }

    const totalEUR = total / rates[currentCurrency];

    const res = await apiCall('purchase', {
        username: currentUser,
        token: currentToken,
        product: products.join(', '),
        price: totalEUR
    });

    if(res.success){

        showToastMsg(`Purchase successful! Code: ${res.data.code}`);

        purchaseHistory.unshift({
            product: products.join(', '),
            code: res.data.code,
            date: new Date().toLocaleString()
        });

        renderOrders();

        cart = [];

        saveCart();
        updateCartUI();

        await updateBalanceDisplay();

    } else {

        showToastMsg(res.message, true);
    }
}

function renderOrders(){

    const container = document.getElementById('ordersList');

    if(!purchaseHistory.length){

        container.innerHTML = 'No purchases yet';

        return;
    }

    container.innerHTML = purchaseHistory.map(order => `

        <div class="order-item">
            <div class="order-game">${order.product}</div>
            <div class="order-code">${order.code}</div>
            <div>${order.date}</div>
        </div>

    `).join('');
}

async function submitFeedback(){

    const name = document
        .getElementById('feedbackName')
        .value
        .trim();

    const message = document
        .getElementById('feedbackMsg')
        .value
        .trim();

    if(!message){
        showToastMsg('Enter message', true);
        return;
    }

    const res = await apiCall('feedback', {
        name,
        message
    });

    if(res.success){

        showToastMsg('Feedback sent');

        document.getElementById('feedbackName').value = '';
        document.getElementById('feedbackMsg').value = '';

    } else {

        showToastMsg('Failed', true);
    }
}

function openLoginModal(){
    document.getElementById('loginModal').classList.add('active');
}

function closeLoginModal(){
    document.getElementById('loginModal').classList.remove('active');
}

function init(){

    loadCart();

    document
        .getElementById('openCartBtn')
        .addEventListener('click', toggleCart);

    document
        .getElementById('closeCartBtn')
        .addEventListener('click', toggleCart);

    const saved = localStorage.getItem('shopUser');

    if(saved){

        try {

            const data = JSON.parse(saved);

            currentUser = data.username;
            currentToken = data.token;

            document.getElementById('userBar').style.display = 'flex';
            document.getElementById('loginPromptBar').style.display = 'none';

            updateBalanceDisplay();

        } catch(err){

            localStorage.removeItem('shopUser');
        }
    }
}

init();
</script>
